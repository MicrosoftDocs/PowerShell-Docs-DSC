# This workflow verifies that an author submitting a pull request to the live
# branch is authorized to do so; only users with maintainer or admin rights may
# target the live branch directly.
name: Authorization
on:
  pull_request_target: # Required to retrieve permissions to verify for forks
    branches:
      - live
permissions:
  contents: read
jobs:
  Test:
    name: Check Branch Permissions
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Authorized to Target Live Branch?
        uses: MicrosoftDocs/PowerShell-Docs/.github/actions/verification/authorization/v1@a3de8f22552170e70852470d46cd52cd9ca471ec
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          authorized_accounts: learn-build-service-prod[bot]
